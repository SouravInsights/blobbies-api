name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys fight over the same container.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # GHCR requires a lowercase image name, and this repo's owner is
  # "SouravInsights", so the name is written out rather than derived.
  IMAGE: ghcr.io/souravinsights/blobbies-api

jobs:
  build:
    name: Build and push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built for amd64 because that is what Lightsail runs. The build happens
      # here, not on the instance: a 1GB box cannot run `npm ci` and `tsc`
      # without swapping itself to death.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Lightsail
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy secrets are set
        run: |
          [ -n "${{ secrets.LIGHTSAIL_HOST }}" ] || {
            echo "::error::Add a LIGHTSAIL_HOST repository secret (the instance's IP)."; exit 1; }
          [ -n "${{ secrets.LIGHTSAIL_SSH_KEY }}" ] || {
            echo "::error::Add a LIGHTSAIL_SSH_KEY repository secret (the .pem contents)."; exit 1; }

      - name: Trust the host
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # The deploy logic lives in the repo, not in YAML, so it can be read and
      # run by hand on the instance too.
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ vars.LIGHTSAIL_USER || 'ubuntu' }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "IMAGE='${{ env.IMAGE }}' TAG='${{ github.sha }}' bash -s" \
            < scripts/deploy-remote.sh
